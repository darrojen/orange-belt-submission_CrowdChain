name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  contracts:
    name: Contracts (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build registry wasm first
        run: cargo build -p registry-contract --release --target wasm32v1-none
      - name: Run contract tests
        run: cargo test --workspace
      - name: Build release Wasm
        run: cargo build --workspace --release --target wasm32v1-none
      - name: Upload Wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: target/wasm32v1-none/release/*.wasm
  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
