name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Contracts — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run contract unit tests
        run: cargo test --workspace --verbose

      - name: Build contract Wasm (release)
        run: cargo build --workspace --release --target wasm32v1-none

      - name: Upload Wasm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: target/wasm32v1-none/release/*.wasm

  frontend:
    name: Frontend — lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CROWDFUNDING_CONTRACT_ID: ${{ secrets.CROWDFUNDING_CONTRACT_ID || 'CATESTPLACEHOLDER00000000000000000000000000000000000000000' }}
          NEXT_PUBLIC_REGISTRY_CONTRACT_ID: ${{ secrets.REGISTRY_CONTRACT_ID || 'CATESTPLACEHOLDER00000000000000000000000000000000000000000' }}
          NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
